# Automatic analysis reads this file, not sonar-project.properties.
# The main application uses Python 3.13; diarization and UVR use Python 3.12.
sonar.python.version=3.12,3.13
sonar.sourceEncoding=UTF-8

# Keep all production files in scope. Automatic analysis requires explicit paths.
# Add new test files to both lists so they are never indexed as production code.
sonar.sources=.
sonar.tests=test_batch.py,test_ordered_queue.py,test_sorted_views.py,test_table_view.py,test_import_report.py,test_import_repair.py,test_import_store.py,test_media_discovery.py,test_path_budgets.py,test_local_queue.py,test_managed_browser.py,test_media_formats.py,test_portability.py,test_queue_scope.py,test_queue_upgrade.py,test_recovery.py,test_session_access_ui.py,test_setup.py,test_sonar_regressions.py,test_transcribe.py,test_transcript_edit.py,test_uvr_timing.py,test_youtube_access.py,test_destination_access.py,test_relocation.py,test_start_responsiveness.py,test_support.py,test_empty_and_fallback.py,test_audio_recovery.py,test_damaged_media.py,test_recovered_export.py,test_sonar_scope.py,test_queue_finish_ui.py
sonar.exclusions=test_batch.py,test_ordered_queue.py,test_sorted_views.py,test_table_view.py,test_import_report.py,test_import_repair.py,test_import_store.py,test_media_discovery.py,test_path_budgets.py,test_local_queue.py,test_managed_browser.py,test_media_formats.py,test_portability.py,test_queue_scope.py,test_queue_upgrade.py,test_recovery.py,test_session_access_ui.py,test_setup.py,test_sonar_regressions.py,test_transcribe.py,test_transcript_edit.py,test_uvr_timing.py,test_youtube_access.py,test_destination_access.py,test_relocation.py,test_start_responsiveness.py,test_support.py,test_empty_and_fallback.py,test_audio_recovery.py,test_damaged_media.py,test_recovered_export.py,test_sonar_scope.py,test_queue_finish_ui.py
