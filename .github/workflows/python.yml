name: Python unit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-batch.lock.txt
            requirements-test.lock.txt
      - name: Install locked application dependencies
        run: python -m pip install -r requirements-batch.lock.txt -r requirements-test.lock.txt
      - name: Check Sonar source and test classification in this commit
        run: python scripts/check_sonar_scope.py --revision HEAD
      - name: Check dependency consistency
        run: python -m pip check
      - name: Install FFmpeg for real media integration tests
        run: |
          choco install ffmpeg --version=8.0.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          Get-Command ffmpeg -ErrorAction Stop
          Get-Command ffprobe -ErrorAction Stop
      - name: Compile sources
        run: python -m compileall -q batch kolejka.py transcribe.py
      - name: Run offline tests
        run: python -m unittest discover -v
